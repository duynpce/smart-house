; PlatformIO Project Configuration File
; Smart House IoT System

[platformio]
default_envs = esp32-prod

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- Production / Docker Environment ---
; Retrieves variables from System/Docker environment variables and injects them as C++ Macros
[env:esp32-prod]
build_flags = 
    -D PROD_BUILD
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -D BACKEND_URL=\"${sysenv.BACKEND_URL}\"
    -D API_KEY=\"${sysenv.API_KEY}\"

; --- Local Development Environment ---
; Uses hardcoded local values from Config.h.local
[env:esp32-local]
build_flags = 
    -D LOCAL_BUILD
